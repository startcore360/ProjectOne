name: M13 Staff Appraisal Verification

on:
  push:
    branches: [sprint-3-development]
    paths:
      - "api/src/main/java/com/edu360/api/staff/**"
      - "api/src/test/java/com/edu360/api/staff/StaffAppraisalIT.java"
      - "app/src/features/staff/**"
      - "sql/59_v41_staff_qualification_and_leave_indexes.sql"
      - "sql/59_v41_staff_qualification_and_leave_rollback.sql"
      - ".github/workflows/m13-appraisal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m13-appraisal-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appraisal:
    name: M13 backend and frontend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate and build database fixtures
        env:
          PGPASSWORD: postgres
          PSQL: psql -h localhost -U postgres
        run: |
          chmod +x sql/run_all.sh
          ./sql/run_all.sh
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Run StaffAppraisalIT
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/edu360_v4_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn --batch-mode --no-transfer-progress -f api/pom.xml test -Dtest=StaffAppraisalIT
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Run frontend lint
        working-directory: app
        run: npm run lint
      - name: Build frontend
        working-directory: app
        run: npm run build
