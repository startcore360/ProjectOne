name: EDU 360 CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# Keep one running and one latest pending CI run per workflow/ref. New pushes do not
# cancel the active run; they replace only an obsolete pending run.
concurrency:
  group: edu360-ci-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Run T1 term-lock modal tests
        id: t1
        continue-on-error: true
        run: npm test -- TermLockModal
      - name: Run T5 merit-list page tests
        id: t5
        continue-on-error: true
        run: npm test -- MeritListGenerationPage
      - name: Run T7 marks-entry page tests
        id: t7
        continue-on-error: true
        run: npm test -- MarksEntrySheetPage
      - name: Run T6 attendance register tests
        id: t6
        continue-on-error: true
        run: npm test -- AttendanceRegisterPage
      - name: Run T8 fee payment portal tests
        id: t8
        continue-on-error: true
        run: npm test -- FeePaymentPortalPage
      - name: Run complete unit test suite
        id: unit
        continue-on-error: true
        run: npm test
      - name: Type-check and production build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Upload frontend build
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: edu360-frontend-dist-${{ github.sha }}
          path: app/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Enforce frontend quality gate
        if: always()
        env:
          LINT: ${{ steps.lint.outcome }}
          T1: ${{ steps.t1.outcome }}
          T5: ${{ steps.t5.outcome }}
          T7: ${{ steps.t7.outcome }}
          T6: ${{ steps.t6.outcome }}
          T8: ${{ steps.t8.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          failed=0
          for check in LINT T1 T5 T6 T7 T8 UNIT BUILD; do
            value="${!check}"
            echo "$check: $value"
            [ "$value" = "success" ] || failed=1
          done
          exit "$failed"

  backend:
    name: Spring Boot quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Run T1 term-lock and roll-down tests
        id: t1
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress -f api/pom.xml test -Dtest=AcademicTermLockIT,RoleRolldownIT
      - name: Run T4 student integration tests
        id: t4
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress -f api/pom.xml test -Dtest=StudentServiceIT,StudentNoteGuardIT
      - name: Run T5 admissions merit and C12 tests
        id: t5
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress -f api/pom.xml test -Dtest=MeritListCalculationIT,MeritApprovalRuleC12IT,AdmissionPaymentEventHandlerTest
      - name: Run M13 staff appraisal integration tests
        id: m13
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress -f api/pom.xml test -Dtest=StaffAppraisalIT
      - name: Run T7 SGPA and report-card gate tests
        id: t7
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress -f api/pom.xml test -Dtest=SGPACalculatorTest,ReportCardPublishGateIT
      - name: Run T6 timetable and attendance tests
        id: t6
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress -f api/pom.xml test -Dtest=TimetableGiSTConflictIT,AttendanceCalculationIT
      - name: Run T8 fee and payment security tests
        id: t8
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress -f api/pom.xml test -Dtest=PaymentWebhookSecurityIT,LateFeeCalculationIT,PaymentReconciliationServiceTest
      - name: Verify backend
        id: verify
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress -f api/pom.xml verify
      - name: Upload backend package
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: edu360-backend-package-${{ github.sha }}
          path: api/target/*.jar
          if-no-files-found: error
          retention-days: 7
      - name: Enforce backend quality gate
        if: always()
        env:
          T1: ${{ steps.t1.outcome }}
          T4: ${{ steps.t4.outcome }}
          T5: ${{ steps.t5.outcome }}
          M13: ${{ steps.m13.outcome }}
          T7: ${{ steps.t7.outcome }}
          T6: ${{ steps.t6.outcome }}
          T8: ${{ steps.t8.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          failed=0
          for check in T1 T4 T5 M13 T6 T7 T8 VERIFY; do
            value="${!check}"
            echo "$check: $value"
            [ "$value" = "success" ] || failed=1
          done
          exit "$failed"

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit npm dependencies
        working-directory: app
        run: npm audit --audit-level=high
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Audit Maven dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # Read the key from the environment without placing its value in Maven arguments.
          mvn --batch-mode --no-transfer-progress -f api/pom.xml org.owasp:dependency-check-maven:12.2.2:check -DfailBuildOnCVSS=7 -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
      # gitleaks CLI instead of gitleaks/gitleaks-action@v2: the action builds its own range
      # ("<first PR commit>^..<last PR commit>" from the GitHub API), which failed with
      # "ambiguous argument ... unknown revision" and exit code 1 without scanning anything.
      # Here the range comes straight from the event, and both ends are always in this
      # fetch-depth: 0 clone. Allowed false positives live in .gitleaks.toml / .gitleaksignore.
      - name: Scan repository for secrets
        if: always()
        env:
          GITLEAKS_VERSION: "8.24.3"
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$archive" gitleaks
          cd "$GITHUB_WORKSPACE"

          has_commit() { [ -n "$1" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          range=""
          if [ "$EVENT_NAME" = "pull_request" ] && has_commit "$PR_BASE_SHA" && has_commit "$PR_HEAD_SHA"; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ] && has_commit "$PUSH_BEFORE_SHA"; then
            range="$PUSH_BEFORE_SHA..$GITHUB_SHA"
          fi
          # No usable range (new branch, force push, manual run): scan the whole history.
          # Build the options without a trailing space - "--no-merges " makes git fail.
          log_opts="--no-merges${range:+ $range}"
          echo "Scanning: ${range:-full history}"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --exit-code 1 \
            --report-format sarif --report-path gitleaks-results.sarif \
            --log-opts="$log_opts" .
      - name: Upload secret scan report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results-${{ github.sha }}
          path: gitleaks-results.sarif
          if-no-files-found: ignore

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, java-kotlin
      - name: Autobuild supported projects
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3


  t10-postgres-integration:
    name: T10 PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      EDU360_T10_JDBC_URL: jdbc:postgresql://localhost:5432/edu360_t10
      EDU360_T10_JDBC_USER: edu_app
      EDU360_T10_JDBC_PASSWORD: t10-ci-only
      EDU360_REPORT_JDBC_URL: jdbc:postgresql://localhost:5432/edu360_t10
      EDU360_REPORT_JDBC_USER: edu_report
      EDU360_REPORT_JDBC_PASSWORD: report-ci-only
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Prepare disposable T10 database
        run: |
          createdb -h localhost -U postgres edu360_t10
          psql -h localhost -U postgres -d edu360_t10 -v ON_ERROR_STOP=1 -f sql/01_schema.sql
          psql -h localhost -U postgres -d edu360_t10 -v ON_ERROR_STOP=1 -f sql/02_rules.sql
          psql -h localhost -U postgres -d edu360_t10 -v ON_ERROR_STOP=1 -f sql/03_bindings.sql
          psql -h localhost -U postgres -d edu360_t10 -v ON_ERROR_STOP=1 -f sql/03b_fk_indexes.sql
          psql -h localhost -U postgres -d edu360_t10 -v ON_ERROR_STOP=1 -f sql/73_v41_notices_and_communications.sql
          psql -h localhost -U postgres -d edu360_t10 -v ON_ERROR_STOP=1 -f sql/74_v41_library_and_transport_schema.sql
          # Reapply owned migrations to verify safe idempotency against populated schema.
          psql -h localhost -U postgres -d edu360_t10 -v ON_ERROR_STOP=1 -f sql/73_v41_notices_and_communications.sql
          psql -h localhost -U postgres -d edu360_t10 -v ON_ERROR_STOP=1 -f sql/74_v41_library_and_transport_schema.sql
          psql -h localhost -U postgres -d edu360_t10 -v ON_ERROR_STOP=1 -f sql/73t_tests_notices_and_communications.sql
          psql -h localhost -U postgres -d edu360_t10 -v ON_ERROR_STOP=1 -f sql/74t_tests_library_and_transport_schema.sql
          psql -h localhost -U postgres -d edu360_t10 -v ON_ERROR_STOP=1 -c "ALTER ROLE edu_app PASSWORD 't10-ci-only'; ALTER ROLE edu_report PASSWORD 'report-ci-only'; GRANT CONNECT ON DATABASE edu360_t10 TO edu_app, edu_report;"
      - name: Run opt-in T10 PostgreSQL and provider tests
        run: mvn --batch-mode --no-transfer-progress -f api/pom.xml -Dtest=DispatchProviderTest,DispatchWorkerIT,LibraryOverdueFineIT,TransportCapacityIT,ExecutiveAnalyticsReportIT test
      - name: Verify T10 rollback scripts
        if: always()
        run: |
          psql -h localhost -U postgres -d edu360_t10 -v ON_ERROR_STOP=1 -f sql/74r_v41_library_and_transport_schema_rollback.sql
          psql -h localhost -U postgres -d edu360_t10 -v ON_ERROR_STOP=1 -f sql/73r_v41_notices_and_communications_rollback.sql
          psql -h localhost -U postgres -d edu360_t10 -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF to_regclass('app.notice_bulletin') IS NOT NULL OR to_regclass('app.library_catalog') IS NOT NULL OR to_regclass('app.v_student_library_dues_flag') IS NOT NULL THEN RAISE EXCEPTION 'T10 rollback left owned objects behind'; END IF; END \$\$;"

  database-migration-validation:
    name: PostgreSQL migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate EDU 360 SQL package
        env:
          PGPASSWORD: postgres
          PSQL: psql -h localhost -U postgres
        run: |
          chmod +x sql/run_all.sh
          ./sql/run_all.sh
