name: EDU 360 CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# One active CI run per workflow/ref. A newer push supersedes an older run
# on the same branch; other branches (including master) remain independent.
concurrency:
  group: edu360-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run complete unit test suite
        run: npm test
      - name: Type-check and production build
        run: npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: edu360-frontend-dist-${{ github.sha }}
          path: app/dist/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Spring Boot quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Verify backend
        run: mvn --batch-mode --no-transfer-progress -f api/pom.xml verify
      - name: Upload backend package
        uses: actions/upload-artifact@v4
        with:
          name: edu360-backend-package-${{ github.sha }}
          path: api/target/*.jar
          if-no-files-found: error
          retention-days: 7

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit npm dependencies
        working-directory: app
        run: npm audit --audit-level=high
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Audit Maven dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # Read the key from the environment without placing its value in Maven arguments.
          mvn --batch-mode --no-transfer-progress -f api/pom.xml org.owasp:dependency-check-maven:12.2.2:check -DfailBuildOnCVSS=7 -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
      # gitleaks CLI instead of gitleaks/gitleaks-action@v2: the action builds its own range
      # ("<first PR commit>^..<last PR commit>" from the GitHub API), which failed with
      # "ambiguous argument ... unknown revision" and exit code 1 without scanning anything.
      # Here the range comes straight from the event, and both ends are always in this
      # fetch-depth: 0 clone. Allowed false positives live in .gitleaks.toml / .gitleaksignore.
      - name: Scan repository for secrets
        if: always()
        env:
          GITLEAKS_VERSION: "8.24.3"
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$archive" gitleaks
          cd "$GITHUB_WORKSPACE"

          has_commit() { [ -n "$1" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          range=""
          if [ "$EVENT_NAME" = "pull_request" ] && has_commit "$PR_BASE_SHA" && has_commit "$PR_HEAD_SHA"; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ] && has_commit "$PUSH_BEFORE_SHA"; then
            range="$PUSH_BEFORE_SHA..$GITHUB_SHA"
          fi
          # No usable range (new branch, force push, manual run): scan the whole history.
          # Build the options without a trailing space - "--no-merges " makes git fail.
          log_opts="--no-merges${range:+ $range}"
          echo "Scanning: ${range:-full history}"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --exit-code 1 \
            --report-format sarif --report-path gitleaks-results.sarif \
            --log-opts="$log_opts" .
      - name: Upload secret scan report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results-${{ github.sha }}
          path: gitleaks-results.sarif
          if-no-files-found: ignore

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, java-kotlin
      - name: Autobuild supported projects
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  database-migration-validation:
    name: PostgreSQL migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate EDU 360 SQL package
        env:
          PGPASSWORD: postgres
          PSQL: psql -h localhost -U postgres
        run: |
          chmod +x sql/run_all.sh
          ./sql/run_all.sh

  integration-tests:
    name: PostgreSQL, Keycloak and LocalStack integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Start PostgreSQL
        run: docker compose -p edu360-postgres -f docker/postgres/docker-compose.yml up -d
      - name: Start Keycloak with committed test realms
        run: docker compose -p edu360-keycloak -f docker/keycloak/docker-compose.yml up -d
      - name: Start LocalStack with S3 bucket bootstrap
        run: docker compose -p edu360-localstack -f docker/localstack/docker-compose.yml up -d
      - name: Wait for integration services
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if docker exec edu360-postgres-postgres-1 pg_isready -U edu360 >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec edu360-postgres-postgres-1 pg_isready -U edu360
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/realms/master/.well-known/openid-configuration >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:8081/realms/master/.well-known/openid-configuration >/dev/null
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4566/_localstack/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4566/_localstack/health >/dev/null
          docker exec edu360-localstack-localstack-1 awslocal s3api head-bucket --bucket edu360-files
      - name: Run Failsafe integration suite
        env:
          LOCALSTACK_ENDPOINT: http://127.0.0.1:4566
          S3_FILE_BUCKET: edu360-files
          S3_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: mvn --batch-mode --no-transfer-progress -f api/pom.xml verify -Pit
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edu360-integration-test-reports-${{ github.sha }}
          path: |
            api/target/failsafe-reports/
            api/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  platform-e2e:
    name: Platform Playwright end-to-end suite
    if: github.event_name == 'workflow_dispatch' && vars.EDU360_E2E_ENABLED == 'true'
    runs-on: [self-hosted, edu360-e2e]
    defaults:
      run:
        working-directory: app
    env:
      EDU360_E2E_PRODUCT_OWNER_TOKEN: ${{ secrets.EDU360_E2E_PRODUCT_OWNER_TOKEN }}
      EDU360_E2E_PLATFORM_ADMIN_TOKEN: ${{ secrets.EDU360_E2E_PLATFORM_ADMIN_TOKEN }}
      EDU360_E2E_BILLING_MANAGER_TOKEN: ${{ secrets.EDU360_E2E_BILLING_MANAGER_TOKEN }}
      EDU360_E2E_SUPPORT_MANAGER_TOKEN: ${{ secrets.EDU360_E2E_SUPPORT_MANAGER_TOKEN }}
      EDU360_E2E_RELEASE_MANAGER_TOKEN: ${{ secrets.EDU360_E2E_RELEASE_MANAGER_TOKEN }}
      EDU360_E2E_DPO_TOKEN: ${{ secrets.EDU360_E2E_DPO_TOKEN }}
      EDU360_E2E_TENANT_TOKEN: ${{ secrets.EDU360_E2E_TENANT_TOKEN }}
      EDU360_E2E_TENANT_ID: ${{ secrets.EDU360_E2E_TENANT_ID }}
      EDU360_E2E_TENANT_SUBDOMAIN: ${{ secrets.EDU360_E2E_TENANT_SUBDOMAIN }}
      EDU360_E2E_DPO_READY_REQUEST_ID: ${{ secrets.EDU360_E2E_DPO_READY_REQUEST_ID }}
      EDU360_E2E_BILLING_TENANT_ID: ${{ secrets.EDU360_E2E_BILLING_TENANT_ID }}
      EDU360_E2E_PLATFORM_URL: ${{ vars.EDU360_E2E_PLATFORM_URL || 'http://platform.edu360.localhost:5173' }}
      EDU360_E2E_API_PORT: ${{ vars.EDU360_E2E_API_PORT || '8080' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify E2E fixture secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in EDU360_E2E_PRODUCT_OWNER_TOKEN EDU360_E2E_PLATFORM_ADMIN_TOKEN EDU360_E2E_BILLING_MANAGER_TOKEN EDU360_E2E_SUPPORT_MANAGER_TOKEN EDU360_E2E_RELEASE_MANAGER_TOKEN EDU360_E2E_DPO_TOKEN EDU360_E2E_TENANT_TOKEN EDU360_E2E_TENANT_ID EDU360_E2E_TENANT_SUBDOMAIN EDU360_E2E_DPO_READY_REQUEST_ID EDU360_E2E_BILLING_TENANT_ID; do
            test -n "${!name}" || { echo "Missing required E2E secret: $name"; exit 1; }
          done
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install pinned Playwright runner without changing the app lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Type-check Playwright suite
        run: npm run e2e:typecheck
      - name: Run platform E2E scenarios
        run: npm run e2e
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edu360-playwright-report-${{ github.sha }}
          path: |
            app/playwright-report/
            app/test-results/
          if-no-files-found: ignore
          retention-days: 14
