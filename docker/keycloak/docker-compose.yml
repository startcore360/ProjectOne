services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-kcadmin}
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
    # Test-server only. UAT must supply a unique password in its protected env file.
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./realm-export-abc.json:/opt/keycloak/data/import/realm-export-abc.json:ro
      - ./realm-export-xyz.json:/opt/keycloak/data/import/realm-export-xyz.json:ro
      - ./realm-export-platform.json:/opt/keycloak/data/import/realm-export-platform.json:ro
      - ./themes/edu360:/opt/keycloak/themes/edu360:ro

volumes:
  keycloak_data:
