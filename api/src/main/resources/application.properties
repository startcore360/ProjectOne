spring.application.name=edu360-api
server.port=${SERVER_PORT:8080}
spring.jpa.open-in-view=false
spring.profiles.default=dev

# JWT expiration is shared; signing secret is supplied by the active profile.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Enable Secure cookies behind HTTPS in deployed environments.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
# Exact frontend origin for credentialed browser requests; never use '*'.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
