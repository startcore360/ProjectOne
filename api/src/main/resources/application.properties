spring.application.name=edu360-api
server.port=${SERVER_PORT:8080}
spring.jpa.open-in-view=false
# BS-24: Do not default to dev profile in unconfigured deployments
spring.profiles.default=

# Exact frontend origin allowed to call this API; never use '*'.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Dev-only: lets several local tenant hostnames (abc.edu360.local, xyz.edu360.local,
# platform.edu360.local - see docker/dev-hosts-setup.ps1) all call the API during local
# multi-tenant testing. Left unset in application-prod.properties, so production always falls
# back to the single exact origin above - patterns are never allowed outside dev.
app.cors.allowed-origin-patterns=

# Where LocalFileStorage writes uploaded files (profile photos today - see FileObject's class
# comment for why this is a deliberate interim local-disk implementation, not the real
# object-store the schema's own storage_key comment describes). Override via env var in any
# environment that needs a different location.
app.file-storage.base-dir=${FILE_STORAGE_BASE_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB