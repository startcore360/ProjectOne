spring.application.name=edu360-api
server.port=${SERVER_PORT:8080}
spring.jpa.open-in-view=false
# BS-24: Do not default to dev profile in unconfigured deployments
spring.profiles.default=

# Exact frontend origin allowed to call this API; never use '*'.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Dev-only: lets several local tenant hostnames (abc.edu360.local, xyz.edu360.local,
# platform.edu360.local - see docker/dev-hosts-setup.ps1) all call the API during local
# multi-tenant testing. Left unset in application-prod.properties, so production always falls
# back to the single exact origin above - patterns are never allowed outside dev.
app.cors.allowed-origin-patterns=

# Where LocalFileStorage writes uploaded files (profile photos today - see FileObject's class
# comment for why this is a deliberate interim local-disk implementation, not the real
# object-store the schema's own storage_key comment describes). Override via env var in any
# environment that needs a different location.
app.file-storage.base-dir=${FILE_STORAGE_BASE_DIR:./data/uploads}

# ProfileService enforces its own 2 MiB image limit; the multipart ceiling permits the separate
# 10 MiB general-file endpoint. The 11 MiB request limit includes multipart boundaries.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
files.allow-pending-download=${FILES_ALLOW_PENDING_DOWNLOAD:false}
# Enable ClamAV clamd INSTREAM scanning only when the clamd service is deployed and reachable.
# The default development stack includes clamd; deployments may override this explicitly.
# With the scanner enabled, unavailable ClamAV fails closed and never marks files clean.
files.scanner.clamav.enabled=${FILES_SCANNER_CLAMAV_ENABLED:true}
files.scanner.clamav.host=${FILES_SCANNER_CLAMAV_HOST:127.0.0.1}
files.scanner.clamav.port=${FILES_SCANNER_CLAMAV_PORT:3310}

# DEC-24: parent/applicant mobile OTP login remains disabled until provider and Keycloak exchange are deployed.
auth.otp.enabled=false
# API-signed, short-lived support-session tokens. Supply a unique >=32-byte secret in each deployment.
app.support-session.signing-secret=${SUPPORT_SESSION_SIGNING_SECRET:}
# PRODUCTION: set SUPPORT_SESSION_TENANT_BASE_DOMAIN to the real wildcard domain (e.g. edu360.com,
# served by a *.edu360.com DNS record and certificate). The edu360.local default is a dev address.
app.support-session.tenant-base-domain=${SUPPORT_SESSION_TENANT_BASE_DOMAIN:edu360.local}
app.support-session.tenant-scheme=${SUPPORT_SESSION_TENANT_SCHEME:https}

# T10 dispatch worker and external gateway adapters. Keep bearer tokens in deployment secrets.
app.dispatch.worker.fixed-delay-ms=${DISPATCH_WORKER_FIXED_DELAY_MS:5000}
app.dispatch.providers.push.url=${DISPATCH_PUSH_URL:}
app.dispatch.providers.push.token=${DISPATCH_PUSH_TOKEN:}
app.dispatch.providers.sms.url=${DISPATCH_SMS_URL:}
app.dispatch.providers.sms.token=${DISPATCH_SMS_TOKEN:}
app.dispatch.providers.email.url=${DISPATCH_EMAIL_URL:}
app.dispatch.providers.email.token=${DISPATCH_EMAIL_TOKEN:}
# Payment gateway configuration. Credentials are resolved per tenant/institution from AWS
# Secrets Manager; no gateway keys belong in application properties or source control.
app.payments.secret-name-template=${PAYMENT_GATEWAY_SECRET_NAME_TEMPLATE:edu360/tenants/{tenantId}/institutions/{institutionId}/payments}
# Stripe requires absolute, platform-approved return URL templates. {tenantId} is substituted per checkout.
app.payments.stripe-success-url=${STRIPE_SUCCESS_URL:}
app.payments.stripe-cancel-url=${STRIPE_CANCEL_URL:}
