# Production profile. Supply all secrets and connection details through the deployment environment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# Keycloak realm issuer and Admin API credentials - all required, no defaults, supplied by
# the deployment environment. See docs/KEYCLOAK_MIGRATION_PLAN.md.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

app.keycloak.base-url=${KEYCLOAK_BASE_URL}
app.keycloak.realm=${KEYCLOAK_REALM}
app.keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
app.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
app.keycloak.frontend-client-id=${KEYCLOAK_FRONTEND_CLIENT_ID}
