# Production profile. Supply all secrets and connection details through the deployment environment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Second role for platform.* tables (platform.tenant, platform.plan, platform.platform_user, ...)
# - see PlatformJpaConfig. sql/03_bindings.sql grants these tables to edu_platform only; the main
# SPRING_DATASOURCE_USERNAME above (edu_app) has no access to the platform schema at all.
app.platform-admin-datasource.username=${PLATFORM_ADMIN_DATASOURCE_USERNAME}
app.platform-admin-datasource.password=${PLATFORM_ADMIN_DATASOURCE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# Keycloak realm issuer and Admin API credentials - all required, no defaults, supplied by
# the deployment environment. See docs/KEYCLOAK_MIGRATION_PLAN.md.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

app.keycloak.base-url=${KEYCLOAK_BASE_URL}
app.keycloak.realm=${KEYCLOAK_REALM}
app.keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
app.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
app.keycloak.frontend-client-id=${KEYCLOAK_FRONTEND_CLIENT_ID}
app.keycloak.platform-realm=${KEYCLOAK_PLATFORM_REALM}

# No app.secrets.endpoint-override here on purpose - leaving it unset (its Java default is
# blank, see SecretsManagerProperties) is what makes AwsSecretsManagerTenantSecretsResolver
# talk to the real regional AWS endpoint instead of LocalStack. Never set this in production.
app.secrets.region=${SECRETS_REGION:ap-south-1}
