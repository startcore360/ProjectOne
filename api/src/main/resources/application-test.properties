# Automated-test profile. Same H2 setup as dev, but intentionally distinct from "dev" so
# DevAdminSeeder (@Profile("dev")) never runs here - tests must not depend on a live Keycloak.
spring.datasource.url=jdbc:h2:mem:edu360db-test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# JwtDecoder bean needs an issuer-uri to construct, but nothing in the plain test suite
# actually calls out to it - requests are tested via Spring Security Test's jwt() support
# (SecurityMockMvcRequestPostProcessors), which bypasses real token validation entirely.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/edu360

app.keycloak.base-url=http://localhost:8081
app.keycloak.realm=edu360
app.keycloak.admin-client-id=edu360-admin-cli
app.keycloak.admin-client-secret=test-secret
app.keycloak.frontend-client-id=edu360-frontend
