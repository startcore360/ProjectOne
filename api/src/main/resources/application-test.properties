# Automated-test profile for plain unit/context-load tests that don't need real Postgres (see
# TenantIssuerAuthenticationManagerResolverIT for the real-Postgres+Keycloak integration tests,
# which override these properties directly via @DynamicPropertySource instead of using this
# profile). Distinct from "dev" so DevAdminSeeder (@Profile("dev")) never runs here.
spring.datasource.url=jdbc:h2:mem:edu360db-test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# none, not create-drop: the real entities map onto multiple Postgres schemas (app./platform.)
# that H2 cannot auto-create the way Postgres's sql/ bundle does - trying to generate DDL here
# only produces noisy failed-DDL warnings for tables this profile's tests never touch anyway.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.h2.console.enabled=false

app.keycloak.base-url=http://localhost:8081
app.keycloak.platform-realm=edu360-platform
app.keycloak.master-admin-username=kcadmin
app.keycloak.master-admin-password=kcadmin
app.keycloak.frontend-client-id=edu360-frontend
app.keycloak.local-dev-host-suffix=.edu360.local
app.keycloak.platform-host-label=platform
app.keycloak.identity-events-client-id=edu360-identity-events
app.keycloak.identity-events-client-secret=dev-identity-events-secret

app.secrets.region=ap-south-1
app.secrets.endpoint-override=

app.keycloak.realm-security-sync-on-startup=false
