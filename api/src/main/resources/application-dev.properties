# Local development only. Do not use this profile in deployed environments.
#
# H2 retired for dev as of the Sprint 1 identity migration: the real schema (app.*/platform.*,
# RLS, multiple schemas) has no H2 equivalent, so dev now runs against the same Postgres used
# everywhere else (docker/postgres - see docker/postgres/provision-edu-app.ps1, which creates
# the edu_app role and applies the committed sql/ bundle). Connects as edu_app specifically -
# never a superuser - so RLS is actually enforced in dev the same way it will be in prod.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/edu360db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:edu_app}
# No default password here on purpose - provision-edu-app.ps1 generates it into the gitignored
# docker/postgres/.env.local; dev-up.ps1 reads that file and exports SPRING_DATASOURCE_PASSWORD
# before starting this app. There is no safe default to fall back to for a real credential.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# edu_platform: used ONLY by DevAdminSeeder's one-time dev seed insert into
# platform.platform_user (see that class's javadoc for why edu_app cannot do this itself).
# Same password-sourcing pattern as edu_app - generated once by provision-edu-app.ps1 into
# docker/postgres/.env.local, exported by dev-up.ps1, no default here.
app.platform-admin-datasource.username=${PLATFORM_ADMIN_DATASOURCE_USERNAME:edu_platform}
app.platform-admin-datasource.password=${PLATFORM_ADMIN_DATASOURCE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Schema is entirely owned by sql/ (the approved V4.0 bundle) - Hibernate must never try to
# create or alter it itself, in dev or anywhere else.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.h2.console.enabled=false

# Local Keycloak (see docker/keycloak/docker-compose.yml). Must be running and reachable
# before this app starts in dev - realm JWKS are fetched on first use per realm, and
# DevAdminSeeder calls the Admin API directly at startup.
# 127.0.0.1 rather than localhost: on Windows + Docker Desktop (WSL2), Java's HTTP client can
# resolve "localhost" to the IPv6 loopback (::1), which Docker's port forwarding does not always
# honor - the TCP connection gets accepted and then reset instead of reaching Keycloak.
#
# No spring.security.oauth2.resourceserver.jwt.issuer-uri here any more: the multi-tenant
# resolver (TenantIssuerAuthenticationManagerResolver) picks a realm per request from the
# token's own issuer, not one fixed issuer-uri - that property is now unused dead config and is
# deliberately left out rather than left behind as something that looks load-bearing but isn't.
app.keycloak.base-url=${KEYCLOAK_BASE_URL:http://127.0.0.1:8081}
app.keycloak.platform-realm=${KEYCLOAK_PLATFORM_REALM:edu360-platform}
app.keycloak.frontend-client-id=${KEYCLOAK_FRONTEND_CLIENT_ID:edu360-frontend}
# Master-realm admin account (see docker/keycloak/docker-compose.yml's
# KC_BOOTSTRAP_ADMIN_USERNAME/PASSWORD) - dev-only credentials, never valid in production.
app.keycloak.master-admin-username=${KEYCLOAK_MASTER_ADMIN_USERNAME:kcadmin}
app.keycloak.master-admin-password=${KEYCLOAK_MASTER_ADMIN_PASSWORD:kcadmin}
# Address endings stripped to find the tenant: abc.edu360.local (hosts file) and
# abc-edu360.duckdns.org (one DuckDNS name per tenant, for testing from outside). Comma-separated.
app.keycloak.local-dev-host-suffix=${LOCAL_DEV_HOST_SUFFIX:.edu360.local,-edu360.duckdns.org}
app.keycloak.platform-host-label=${PLATFORM_HOST_LABEL:platform}
app.keycloak.identity-events-client-id=${KEYCLOAK_IDENTITY_EVENTS_CLIENT_ID:edu360-identity-events}
app.keycloak.identity-events-client-secret=${KEYCLOAK_IDENTITY_EVENTS_CLIENT_SECRET:dev-identity-events-secret}

# LocalStack stands in for AWS Secrets Manager locally (docker/localstack/docker-compose.yml) -
# same AwsSecretsManagerTenantSecretsResolver code path as production, only the endpoint differs.
app.secrets.region=ap-south-1
app.secrets.endpoint-override=${SECRETS_ENDPOINT_OVERRIDE:http://127.0.0.1:4566}

# Each local tenant gets its own hostname so the backend can tell tenants apart by the Host
# header (see TenantResolver) - a wildcard pattern here covers all of them with one setting
# instead of listing each one by hand. Port 5173 only, since that is the only port the Vite
# dev server ever runs on locally.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://*.edu360.local:5173,http://*-edu360.duckdns.org:5173}

# B3 / I-01: Keycloak address as the browser reaches it (authenticator set-up hand-off).
app.keycloak.public-base-url=${KEYCLOAK_PUBLIC_BASE_URL:http://127.0.0.1:8081}
# B3 / I-06: common-password file mounted into Keycloak (docker/keycloak/docker-compose.yml).
app.keycloak.password-denylist-name=${KEYCLOAK_PASSWORD_DENYLIST_NAME:edu360-common-passwords.txt}

# DEC-7: bounded local development exception; production remains disabled.
files.allow-pending-download=true

# DEC-24: no SMS provider in local development.
auth.otp.enabled=false
