# Local development only. Do not use this profile in deployed environments.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:edu360db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Local Keycloak (see docker/keycloak/docker-compose.yml). Must be running and reachable
# before this app starts in dev - the resource-server filter fetches its JWKS on first use,
# and DevAdminSeeder calls the Admin API directly at startup.
# 127.0.0.1 rather than localhost: on Windows + Docker Desktop (WSL2), Java's HTTP client can
# resolve "localhost" to the IPv6 loopback (::1), which Docker's port forwarding does not always
# honor - the TCP connection gets accepted and then reset instead of reaching Keycloak.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://127.0.0.1:8081/realms/edu360}

app.keycloak.base-url=${KEYCLOAK_BASE_URL:http://127.0.0.1:8081}
app.keycloak.realm=${KEYCLOAK_REALM:edu360}
app.keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:edu360-admin-cli}
app.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:dev-admin-cli-secret}
app.keycloak.frontend-client-id=${KEYCLOAK_FRONTEND_CLIENT_ID:edu360-frontend}
