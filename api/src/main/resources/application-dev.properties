# Local development only. Do not use this profile in deployed environments.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:edu360db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

